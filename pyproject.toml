[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindlog"
version = "0.1.0"
description = "MindLog extraction pipeline — preliminary validation"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "kagglehub>=0.3.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.15.21",
    "pre-commit>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Prompt text has long descriptive lines by nature; don't reformat what's sent to the LLM.
"src/mindlog/agent/prompts/*.py" = ["E501"]
